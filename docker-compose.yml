version: "3.7"

services:
  godfather:
    image: ivanristovic/godfather:latest
    depends_on:
      - postgres
    volumes:
      - ./data:/app/data

  postgres:
    restart: always
    image: postgres:13-alpine
    volumes:
      - ${DB_ROOT}:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - '5432:5432'
